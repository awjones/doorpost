<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1070" width="1200" height="1070" role="img" aria-labelledby="title desc">
<title id="title">Setting up your home network</title>
<desc id="desc">The router runs your home Wi-Fi, with the brain at a fixed address, and a separate frame Wi-Fi that can reach only the brain on port 8090. Four steps to set it up, a check, and three example prompts to ask an AI assistant.</desc>
<style>
svg { --bg:#faf6ee; --card:#ffffff; --soft:#f3ecdc; --ink:#1d2a44; --muted:#5a6273; --line:#d8ccb2;
  --navy:#1d2a44; --onnavy:#faf6ee; --gilt:#b8913a; --icon:#1d2a44; --off:#c9c2b2; --knob:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#12161f; --card:#1a2030; --soft:#202839; --ink:#e8dcc0; --muted:#a8a08d; --line:#3a4358;
    --navy:#27365a; --onnavy:#e8dcc0; --gilt:#b8913a; --icon:#e8dcc0; --off:#4a5268; --knob:#e8dcc0; }
}
