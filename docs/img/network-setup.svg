<rect class="bg" x="0" y="0" width="1200" height="1070"/>
<text x="40" y="56" class="title">Setting up your home network</text>
<text x="40" y="88" class="sub">Two router settings keep the frame useful and private. An AI assistant can walk you through yours.</text>
<rect class="giltf" x="40" y="104" width="64" height="3" rx="1.5"/>
<rect class="card" x="540" y="132" width="120" height="86" rx="12"/>
<use href="#i-router" x="576" y="132" width="48" height="48"/>
<text x="600" y="206" class="b" text-anchor="middle">Router</text>
<path class="ln" d="M560 218L470 250" marker-end="url(#ah)"/>
<path class="ln" d="M640 218L730 250" marker-end="url(#ah)"/>
<rect class="zone" x="40" y="256" width="520" height="170" rx="18"/>
<text x="64" y="288" class="h">Home Wi-Fi</text>
<text x="64" y="310" class="s">phones, laptops, the brain</text>
<use href="#i-phone" x="66" y="334" width="48" height="48"/>
<use href="#i-laptop" x="126" y="334" width="48" height="48"/>
<text x="66" y="404" class="s">everyday devices</text>
<rect class="gcard" x="296" y="290" width="240" height="112" rx="12"/>
<use href="#i-pi" x="310" y="306" width="48" height="48"/>
<text x="370" y="328" class="h">The brain</text>
<text x="370" y="352" class="b">192.168.1.50</text>
<text x="370" y="374" class="s">a fixed address</text>
<rect class="zoneg" x="640" y="256" width="520" height="170" rx="18"/>
<text x="664" y="288" class="h">Frame Wi-Fi</text>
<text x="664" y="310" class="s">its own network (VLAN)</text>
<use href="#i-frame" x="672" y="326" width="70" height="70"/>
<circle class="giltf" cx="776" cy="358" r="4"/>
<text x="790" y="363" class="b">Can reach: the brain, port 8090</text>
<circle class="offf" cx="776" cy="392" r="4"/>
<text x="790" y="397" class="b">Blocked: internet, home Wi-Fi</text>
<path class="lng" d="M668 360L542 360" marker-end="url(#ahg)"/>
<text x="600" y="346" class="lbl" text-anchor="middle">8090 only</text>
<rect class="card" x="40" y="460" width="265" height="226" rx="14"/>
<circle class="navy" cx="72" cy="494" r="18"/>
<text x="72" y="499" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">1</text>
<use href="#i-pi" x="245" y="474" width="44" height="44"/>
<text x="60" y="544" class="h">Fix the brain&#x27;s address</text>
<text x="60" y="572" class="s">In the router, find the</text>
<text x="60" y="592" class="s">brain in the device list and</text>
<text x="60" y="612" class="s">reserve its address (a DHCP</text>
<text x="60" y="632" class="s">reservation). Then the frame&#x27;s</text>
<text x="60" y="652" class="s">address for it never changes.</text>
<rect class="card" x="325" y="460" width="265" height="226" rx="14"/>
<circle class="navy" cx="357" cy="494" r="18"/>
<text x="357" y="499" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">2</text>
<use href="#i-router" x="530" y="474" width="44" height="44"/>
<text x="345" y="544" class="h">Make a frame Wi-Fi</text>
<text x="345" y="572" class="s">A separate network for the</text>
<text x="345" y="592" class="s">frame: a VLAN, or a guest</text>
<text x="345" y="612" class="s">network that allows one</text>
<text x="345" y="632" class="s">exception. Give it its own</text>
<text x="345" y="652" class="s">name and password.</text>
<rect class="card" x="610" y="460" width="265" height="226" rx="14"/>
<circle class="navy" cx="642" cy="494" r="18"/>
<text x="642" y="499" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">3</text>
<use href="#i-lock" x="815" y="474" width="44" height="44"/>
<text x="630" y="544" class="h">Allow one door</text>
<text x="630" y="572" class="s">Allow: frame network to</text>
<text x="630" y="592" class="s">192.168.1.50, TCP port 8090.</text>
<text x="630" y="612" class="s">Allow: DNS and DHCP.</text>
<text x="630" y="632" class="s">Block: everything else,</text>
<text x="630" y="652" class="s">the internet included.</text>
<rect class="dcard" x="895" y="460" width="265" height="226" rx="14"/>
<circle class="navy" cx="927" cy="494" r="18"/>
<text x="927" y="499" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">4</text>
<use href="#i-cloud" x="1100" y="474" width="44" height="44"/>
<text x="915" y="544" class="h">Away from home</text>
<text x="915" y="572" class="s">Optional. Reach /parent and</text>
<text x="915" y="592" class="s">/admin only through a tunnel</text>
<text x="915" y="612" class="s">with sign-in, such as</text>
<text x="915" y="632" class="s">Cloudflare Tunnel + Access.</text>
<text x="915" y="652" class="s">Never open port 8090 to all.</text>
<rect class="soft" x="40" y="708" width="1120" height="50" rx="10"/>
<use href="#i-check" x="54" y="716" width="34" height="34"/>
<text x="100" y="739" class="b">Check it: on the frame, http://192.168.1.50:8090/ loads, and any public website does not.</text>
<rect class="gcard" x="40" y="790" width="1120" height="250" rx="16"/>
<use href="#i-chat" x="60" y="812" width="48" height="48"/>
<text x="124" y="832" class="h" style="font-size:21px">Ask your AI assistant</text>
<text x="124" y="856" class="s">Tell it your router&#x27;s brand and model, then follow its steps one screen at a time. Swap in your own address.</text>
<rect class="card" x="124" y="878" width="1012" height="42" rx="21"/>
<text x="146" y="905" class="b">“My router is a ___. How do I make a separate Wi-Fi network that can only reach 192.168.1.50 port 8090?”</text>
<rect class="card" x="124" y="930" width="1012" height="42" rx="21"/>
<text x="146" y="957" class="b">“How do I give the computer called ___ a fixed address (a DHCP reservation) on my ___ router?”</text>
<rect class="card" x="124" y="982" width="1012" height="42" rx="21"/>
<text x="146" y="1009" class="b">“How can I check that a device on my frame Wi-Fi reaches 192.168.1.50:8090 and nothing else?”</text>
</svg>
