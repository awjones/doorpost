<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="1200" height="1150" role="img" aria-labelledby="title desc">
<title id="title">Screen sizes and which way up</title>
<desc id="desc">How Doorpost picks a wide or tall layout, then four screen sizes drawn to scale: 7 inch, 10.1 inch (the tested size), 13 to 15.6 inch and 21.5 inch and up, each with resolution, viewing distance, the layout it gets and a caution.</desc>
