<rect class="bg" x="0" y="0" width="1200" height="1150"/>
<text x="40" y="56" class="title">Screen sizes and which way up</text>
<text x="40" y="88" class="sub">Doorpost lays out at 800 px on the short side, then scales to fit. Size decides how far away you can read it.</text>
<rect class="giltf" x="40" y="104" width="64" height="3" rx="1.5"/>
<text x="40" y="152" class="cap">WIDE OR TALL: HOW IT CHOOSES</text>
<rect class="card" x="40" y="168" width="540" height="226" rx="12"/>
<rect x="64" y="200" width="200" height="125" rx="8" style="fill:var(--icon)"/>
<rect class="card" x="72" y="208" width="184" height="109" rx="2" style="stroke-width:1"/>
<rect class="giltf" x="80" y="216" width="60" height="10" rx="2"/>
<rect class="offf" x="80" y="234" width="168" height="54" rx="3"/>
<text x="290" y="216" class="h">Wide</text>
<text x="290" y="242" class="s">The screen is wider than tall.</text>
<text x="290" y="262" class="s">Lays out 1200 to 1440 x 800,</text>
<text x="290" y="282" class="s">then scales to fill it.</text>
<text x="290" y="318" class="s">16:10 screen: 1280 x 800</text>
<text x="290" y="338" class="s">16:9 screen: 1422 x 800</text>
<text x="290" y="358" class="s">4:3 screen: 1200 x 800, with bands</text>
<text x="64" y="360" class="s">Most frames, hung landscape</text>
<rect class="card" x="620" y="168" width="540" height="226" rx="12"/>
<rect x="650" y="190" width="96" height="154" rx="6" style="fill:var(--icon)"/>
<rect class="card" x="656" y="196" width="84" height="142" rx="2" style="stroke-width:1"/>
<rect class="giltf" x="662" y="204" width="40" height="10" rx="2"/>
<rect class="offf" x="662" y="222" width="72" height="90" rx="3"/>
<text x="780" y="216" class="h">Tall</text>
<text x="780" y="242" class="s">Taller than wide by 5% or more.</text>
<text x="780" y="262" class="s">Lays out 800 x 1200 to 1440 and</text>
<text x="780" y="282" class="s">adds the body class vert.</text>
<text x="780" y="302" class="s">Force one with ?layout=tall</text>
<text x="780" y="322" class="s">or ?layout=wide in the address.</text>
<text x="650" y="370" class="s">On its side, or a portrait panel</text>
<text x="1136" y="370" class="s" text-anchor="end">720 x 1280 screen: 800 x 1422</text>
<rect class="soft" x="40" y="410" width="1120" height="50" rx="10"/>
<use href="#i-frame" x="54" y="416" width="38" height="38"/>
<text x="104" y="441" class="b">Turn it on its side and every screen lays itself out again. Screens 1700 px or more across get HD photos.</text>
<text x="40" y="504" class="cap">FOUR SIZES, DRAWN TO SCALE</text>
<text x="40" y="526" class="s">Distances are rough guides for reading the calendar, not rules.</text>
<rect class="card" x="40" y="542" width="1120" height="120" rx="12"/>
<rect x="119" y="582" width="54" height="32" rx="3" style="fill:var(--icon)"/>
<rect class="card" x="122" y="585" width="48" height="26" rx="2" style="stroke-width:1"/>
<text x="260" y="582" class="h">7 inch</text>
<text x="260" y="604" class="s">small frames, Pi Touch Display 2</text>
<text x="520" y="572" class="cap">RESOLUTION</text>
<text x="520" y="596" class="b">1024 x 600</text>
<text x="520" y="616" class="s">or 720 x 1280 (tall)</text>
<text x="720" y="572" class="cap">READ FROM</text>
<text x="720" y="596" class="b">1 to 3 ft</text>
<text x="880" y="572" class="cap">LAYOUT</text>
<text x="880" y="596" class="b">Wide, scaled down</text>
<text x="880" y="616" class="s">tall if hung upright</text>
<use href="#i-warn" x="258" y="629" width="22" height="22"/>
<text x="286" y="645" class="s">Untested. Text gets small: fine on a desk or nightstand, hard to read across a kitchen.</text>
<rect class="gcard" x="40" y="674" width="1120" height="120" rx="12"/>
<rect x="108" y="706" width="77" height="48" rx="3" style="fill:var(--icon)"/>
<rect class="card" x="111" y="709" width="71" height="42" rx="2" style="stroke-width:1"/>
<text x="260" y="714" class="h">10.1 inch</text>
<rect class="giltf" x="360" y="697" width="80" height="24" rx="12"/>
<text x="400.0" y="714" class="cap" text-anchor="middle" style="fill:#ffffff;font-size:12.5px">TESTED</text>
<text x="260" y="736" class="s">the tested frame</text>
<text x="520" y="704" class="cap">RESOLUTION</text>
<text x="520" y="728" class="b">1280 x 800</text>
<text x="520" y="748" class="s">16:10, 1 GB RAM</text>
<text x="720" y="704" class="cap">READ FROM</text>
<text x="720" y="728" class="b">2 to 6 ft</text>
<text x="880" y="704" class="cap">LAYOUT</text>
<text x="880" y="728" class="b">Wide, exactly 1 to 1</text>
<text x="880" y="748" class="s">or tall on its side</text>
<use href="#i-check" x="258" y="761" width="22" height="22"/>
<text x="286" y="777" class="s">Runs every day. Still check the board and Android version before you buy (see Hardware).</text>
<rect class="card" x="40" y="806" width="1120" height="120" rx="12"/>
<rect x="85" y="828" width="122" height="69" rx="4" style="fill:var(--icon)"/>
<rect class="card" x="89" y="832" width="114" height="61" rx="2" style="stroke-width:1"/>
<text x="260" y="846" class="h">13 to 15.6 inch</text>
<text x="260" y="868" class="s">larger frames</text>
<text x="520" y="836" class="cap">RESOLUTION</text>
<text x="520" y="860" class="b">1920 x 1080</text>
<text x="520" y="880" class="s">16:9, gets HD photos</text>
<text x="720" y="836" class="cap">READ FROM</text>
<text x="720" y="860" class="b">4 to 10 ft</text>
<text x="880" y="836" class="cap">LAYOUT</text>
<text x="880" y="860" class="b">Wide, scaled up</text>
<text x="880" y="880" class="s">1422 x 800 layout</text>
<use href="#i-warn" x="258" y="893" width="22" height="22"/>
<text x="286" y="909" class="s">Untested. Boards and Android versions vary more. Make sure the web engine can be updated.</text>
<rect class="card" x="40" y="938" width="1120" height="120" rx="12"/>
<rect x="62" y="947" width="168" height="94" rx="6" style="fill:var(--icon)"/>
<rect class="card" x="68" y="953" width="156" height="82" rx="2" style="stroke-width:1"/>
<text x="260" y="978" class="h">21.5 inch and up</text>
<text x="260" y="1000" class="s">big frames, monitors, TVs</text>
<text x="520" y="968" class="cap">RESOLUTION</text>
<text x="520" y="992" class="b">1920 x 1080+</text>
<text x="520" y="1012" class="s">4K scales fine</text>
<text x="720" y="968" class="cap">READ FROM</text>
<text x="720" y="992" class="b">6 to 15 ft</text>
<text x="880" y="968" class="cap">LAYOUT</text>
<text x="880" y="992" class="b">Wide, scaled up</text>
<text x="880" y="1012" class="s">a mini PC is simpler</text>
<use href="#i-warn" x="258" y="1025" width="22" height="22"/>
<text x="286" y="1041" class="s">Untested. Draws more power and shows burn-in sooner. Use night mode or a timer.</text>
<rect class="soft" x="40" y="1078" width="1120" height="50" rx="10"/>
<use href="#i-warn" x="54" y="1085" width="34" height="34"/>
<text x="100" y="1108" class="b">A caution mark means untested. Read docs/screens.md before you buy a screen.</text>
</svg>
