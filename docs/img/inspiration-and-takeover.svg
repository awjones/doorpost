<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" role="img" aria-labelledby="title desc">
<title id="title">Where it started, and how we took over our frame</title>
<desc id="desc">Credit to Wes Bos, whose repo and video show how to turn a 50 dollar picture frame into a home display, and the two board types it covers. Then seven steps we used to take over our frame, with a warning to stop if anything does not match.</desc>
<style>
