<symbol id="i-sd" viewBox="0 0 48 48"><path class="ic" d="M14 4h20l6 6v32a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path class="icg" d="M19 10v7M24 10v7M29 10v7"/></symbol>
