<rect class="bg" x="0" y="0" width="1200" height="930"/>
<text x="40" y="56" class="title">Where it started, and how we took over our frame</text>
<text x="40" y="88" class="sub">Doorpost builds on Wes Bos&#x27;s work. His repo is the guide for the frame itself.</text>
<rect class="giltf" x="40" y="104" width="64" height="3" rx="1.5"/>
<rect class="gcard" x="40" y="140" width="1120" height="210" rx="16"/>
<use href="#i-code" x="60" y="166" width="56" height="56"/>
<text x="136" y="174" class="cap">INSPIRED BY</text>
<text x="136" y="204" class="h" style="font-size:21px">Wes Bos: $50 picture frame into a home display</text>
<text x="136" y="240" class="b">Written for people and AI assistants to follow, step by step.</text>
<text x="136" y="268" class="b">Repo: github.com/wesbos/photo-frame-dashboard</text>
<text x="136" y="296" class="b">Video: youtube.com/watch?v=ZLycoUMltNI</text>
<text x="136" y="330" class="s">His rules: ask before every write, back up first, one change at a time.</text>
<text x="724" y="174" class="cap">TWO BOARD TYPES IN HIS REPO</text>
<rect class="soft" x="724" y="190" width="416" height="64" rx="10"/>
<use href="#i-chip" x="736" y="202" width="40" height="40"/>
<text x="788" y="218" class="h" style="font-size:17px">Rockchip “BIUFRAME”</text>
<text x="788" y="240" class="s">ADB on out of the box; one setup script</text>
<rect class="soft" x="724" y="266" width="416" height="64" rx="10"/>
<use href="#i-chip" x="736" y="278" width="40" height="40"/>
<text x="788" y="294" class="h" style="font-size:17px">Allwinner A33 “PF1007L”</text>
<text x="788" y="316" class="s">Often in the same-looking frame now; more steps</text>
<text x="40" y="396" class="cap">HOW WE TOOK OVER OUR FRAME (A PF1007L, ANDROID 6.0.1)</text>
<text x="40" y="420" class="s">Every write waited for an OK, one change at a time, with the undo written down first.</text>
<rect class="card" x="40" y="440" width="265" height="190" rx="14"/>
<circle class="navy" cx="72" cy="474" r="18"/>
<text x="72" y="479" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">1</text>
<use href="#i-chip" x="245" y="454" width="44" height="44"/>
<text x="60" y="524" class="h">Identify the board</text>
<text x="60" y="552" class="s">Settings &gt; About: model and</text>
<text x="60" y="572" class="s">chip. Use a USB data cable</text>
<text x="60" y="592" class="s">(USB-A to USB-C on ours).</text>
<text x="60" y="612" class="s">Nothing is changed yet.</text>
<path class="ln" d="M307 535L323 535" marker-end="url(#ah)"/>
<rect class="card" x="325" y="440" width="265" height="190" rx="14"/>
<circle class="navy" cx="357" cy="474" r="18"/>
<text x="357" y="479" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">2</text>
<use href="#i-download" x="530" y="454" width="44" height="44"/>
<text x="345" y="524" class="h">Back it up</text>
<text x="345" y="552" class="s">Copy the frame&#x27;s storage to</text>
<text x="345" y="572" class="s">a computer and check the</text>
<text x="345" y="592" class="s">copy before you change</text>
<text x="345" y="612" class="s">anything.</text>
<path class="ln" d="M592 535L608 535" marker-end="url(#ah)"/>
<rect class="card" x="610" y="440" width="265" height="190" rx="14"/>
<circle class="navy" cx="642" cy="474" r="18"/>
<text x="642" y="479" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">3</text>
<use href="#i-shield" x="815" y="454" width="44" height="44"/>
<text x="630" y="524" class="h">Vendor apps off</text>
<text x="630" y="552" class="s">Disable the maker&#x27;s apps,</text>
<text x="630" y="572" class="s">including one that gives its</text>
<text x="630" y="592" class="s">server a root shell. Keep</text>
<text x="630" y="612" class="s">Wi-Fi off until then.</text>
<path class="ln" d="M877 535L893 535" marker-end="url(#ah)"/>
<rect class="card" x="895" y="440" width="265" height="190" rx="14"/>
<circle class="navy" cx="927" cy="474" r="18"/>
<text x="927" y="479" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">4</text>
<use href="#i-sliders" x="1100" y="454" width="44" height="44"/>
<text x="915" y="524" class="h">Update the web engine</text>
<text x="915" y="552" class="s">Android System WebView</text>
<text x="915" y="572" class="s">44 to 106, so the page runs.</text>
<text x="915" y="592" class="s">Keep the old copy for</text>
<text x="915" y="612" class="s">undo.</text>
<rect class="card" x="40" y="650" width="265" height="190" rx="14"/>
<circle class="navy" cx="72" cy="684" r="18"/>
<text x="72" y="689" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">5</text>
<use href="#i-frame" x="245" y="664" width="44" height="44"/>
<text x="60" y="734" class="h">Install the kiosk</text>
<text x="60" y="762" class="s">A launcher plus the Family</text>
<text x="60" y="782" class="s">Frame kiosk app as the</text>
<text x="60" y="802" class="s">Home screen. Turn system</text>
<text x="60" y="822" class="s">animations off.</text>
<path class="ln" d="M307 745L323 745" marker-end="url(#ah)"/>
<rect class="card" x="325" y="650" width="265" height="190" rx="14"/>
<circle class="navy" cx="357" cy="684" r="18"/>
<text x="357" y="689" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">6</text>
<use href="#i-pi" x="530" y="664" width="44" height="44"/>
<text x="345" y="734" class="h">Point it at your server</text>
<text x="345" y="762" class="s">Set the kiosk address to</text>
<text x="345" y="782" class="s">your server, for example</text>
<text x="345" y="802" class="s">http://192.168.1.50:8090/</text>
<text x="345" y="822" class="s">(a fixed address).</text>
<path class="ln" d="M592 745L608 745" marker-end="url(#ah)"/>
<rect class="card" x="610" y="650" width="265" height="190" rx="14"/>
<circle class="navy" cx="642" cy="684" r="18"/>
<text x="642" y="689" class="h" text-anchor="middle" style="fill:#faf6ee;font-size:17px">7</text>
<use href="#i-lock" x="815" y="664" width="44" height="44"/>
<text x="630" y="734" class="h">Lock the network</text>
<text x="630" y="762" class="s">Join the frame&#x27;s own Wi-Fi</text>
<text x="630" y="782" class="s">that reaches only the</text>
<text x="630" y="802" class="s">server on port 8090.</text>
<text x="630" y="822" class="s">Now it can go online.</text>
<rect class="gcard" x="895" y="650" width="265" height="190" rx="14"/>
<use href="#i-warn" x="913" y="666" width="44" height="44"/>
<text x="915" y="734" class="h">Stop if anything</text>
<text x="915" y="758" class="h">doesn&#x27;t match</text>
<text x="915" y="790" class="s">A different model, chip, size</text>
<text x="915" y="810" class="s">or checksum means a different</text>
<text x="915" y="830" class="s">frame. Ask in his repo first.</text>
<text x="40" y="884" class="s">Ours already had root ADB over USB. Many PF1007L frames don&#x27;t, and need extra steps from his guide.</text>
<text x="40" y="906" class="s">Brand names are not a hardware check: two frames that look the same can have different boards.</text>
</svg>
