<rect class="bg" x="0" y="0" width="1200" height="1010"/>
<text x="40" y="56" class="title">What you need, and how it fits together</text>
<text x="40" y="88" class="sub">A picture frame, one small computer that stays on, and your home Wi-Fi. The rest is optional.</text>
<rect class="giltf" x="40" y="104" width="64" height="3" rx="1.5"/>
<text x="40" y="152" class="cap">THE KIT</text>
<rect class="card" x="40" y="168" width="346" height="170" rx="14"/>
<use href="#i-frame" x="58" y="190" width="48" height="48"/>
<text x="120" y="212" class="h">The picture frame</text>
<text x="120" y="236" class="cap">NEEDED</text>
<text x="60" y="276" class="s">A 10.1 inch Android frame, 1280 x 800.</text>
<text x="60" y="296" class="s">Tested: one cheap frame with an</text>
<text x="60" y="316" class="s">Allwinner A33 board (see Hardware).</text>
<rect class="card" x="427" y="168" width="346" height="170" rx="14"/>
<use href="#i-pi" x="445" y="190" width="48" height="48"/>
<text x="507" y="212" class="h">The brain</text>
<text x="507" y="236" class="cap">PICK ONE</text>
<text x="447" y="276" class="s">A Raspberry Pi 4 or 5 (2 GB or more),</text>
<text x="447" y="296" class="s">its power supply, a microSD card or SSD.</text>
<text x="447" y="316" class="s">Or the Home Assistant box you have.</text>
<rect class="card" x="814" y="168" width="346" height="170" rx="14"/>
<use href="#i-router" x="832" y="190" width="48" height="48"/>
<text x="894" y="212" class="h">Home Wi-Fi router</text>
<text x="894" y="236" class="cap">NEEDED</text>
<text x="834" y="276" class="s">Your normal router. Best if it can make</text>
<text x="834" y="296" class="s">a separate Wi-Fi network for the frame</text>
<text x="834" y="316" class="s">and reserve a fixed address.</text>
<rect class="card" x="40" y="356" width="346" height="170" rx="14"/>
<use href="#i-phone" x="58" y="378" width="48" height="48"/>
<text x="120" y="400" class="h">A parent&#x27;s phone</text>
<text x="120" y="424" class="cap">NICE TO HAVE</text>
<text x="60" y="464" class="s">Opens the /parent page in its browser</text>
<text x="60" y="484" class="s">to approve chores and add screen time.</text>
<text x="60" y="504" class="s">No app to install.</text>
<rect class="dcard" x="427" y="356" width="346" height="170" rx="14"/>
<use href="#i-mac" x="445" y="378" width="48" height="48"/>
<text x="507" y="400" class="h">A Mac</text>
<text x="507" y="424" class="cap">OPTIONAL</text>
<text x="447" y="464" class="s">Only for Apple Photos Favorites and</text>
<text x="447" y="484" class="s">Apple Reminders lists. It sends them</text>
<text x="447" y="504" class="s">to the brain on a schedule.</text>
<rect class="card" x="814" y="356" width="346" height="170" rx="14"/>
<use href="#i-cable" x="832" y="378" width="48" height="48"/>
<text x="894" y="400" class="h">Cables</text>
<text x="894" y="424" class="cap">FOR SETUP</text>
<text x="834" y="464" class="s">A USB data cable from a computer to the</text>
<text x="834" y="484" class="s">frame (USB-A to USB-C for some boards),</text>
<text x="834" y="504" class="s">and the frame&#x27;s own power adapter.</text>
<text x="40" y="584" class="cap">HOW INFORMATION FLOWS</text>
<text x="40" y="608" class="s">Follow the numbers. The frame only ever talks to the brain.</text>
<rect class="card" x="40" y="640" width="240" height="130" rx="12"/>
<use href="#i-cloud" x="54" y="652" width="52" height="52"/>
<text x="116" y="686" class="h">Online services</text>
<text x="60" y="734" class="s">Calendars, weather,</text>
<text x="60" y="754" class="s">shared photo albums</text>
<rect class="card" x="340" y="655" width="130" height="100" rx="12"/>
<use href="#i-router" x="381" y="660" width="48" height="48"/>
<text x="405" y="736" class="b" text-anchor="middle">Router</text>
<rect class="gcard" x="540" y="630" width="320" height="150" rx="14"/>
<use href="#i-pi" x="556" y="646" width="52" height="52"/>
<text x="622" y="670" class="h">The brain</text>
<text x="622" y="692" class="s">Pi or Home Assistant, port 8090</text>
<text x="560" y="730" class="b">Fetches, crops photos, keeps</text>
<text x="560" y="752" class="b">chores and builds the page.</text>
<rect class="card" x="920" y="640" width="240" height="130" rx="12"/>
<use href="#i-frame" x="934" y="654" width="52" height="52"/>
<text x="998" y="686" class="h">Picture frame</text>
<text x="940" y="734" class="s">Shows the page,</text>
<text x="940" y="754" class="s">sends taps back</text>
<rect class="card" x="920" y="820" width="240" height="100" rx="12"/>
<use href="#i-phone" x="932" y="842" width="52" height="52"/>
<text x="992" y="862" class="h">Parent phone</text>
<text x="992" y="886" class="s">the /parent page</text>
<rect class="dcard" x="540" y="830" width="260" height="90" rx="12"/>
<use href="#i-mac" x="554" y="850" width="48" height="48"/>
<text x="614" y="870" class="h">Mac (optional)</text>
<text x="614" y="892" class="s">Photos and Reminders</text>
<path class="ln" d="M286 705L334 705" marker-start="url(#ah)" marker-end="url(#ah)"/>
<path class="ln" d="M476 705L534 705" marker-start="url(#ah)" marker-end="url(#ah)"/>
<circle class="giltf" cx="505" cy="682" r="13"/>
<text x="505" y="687" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">1</text>
<circle class="giltf" cx="838" cy="652" r="13"/>
<text x="838" y="657" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">2</text>
<path class="ln" d="M866 680L914 680" marker-end="url(#ah)"/>
<circle class="giltf" cx="890" cy="660" r="13"/>
<text x="890" y="665" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">3</text>
<path class="ln" d="M914 735L866 735" marker-end="url(#ah)"/>
<circle class="giltf" cx="890" cy="757" r="13"/>
<text x="890" y="762" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">4</text>
<path class="ln" d="M914 870H830V786" marker-end="url(#ah)"/>
<circle class="giltf" cx="872" cy="870" r="13"/>
<text x="872" y="875" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">5</text>
<path class="ln" d="M670 824L670 786" marker-end="url(#ah)"/>
<circle class="giltf" cx="696" cy="806" r="13"/>
<text x="696" y="811" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">6</text>
<circle class="giltf" cx="54" cy="818" r="11"/>
<text x="54" y="823" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">1</text>
<text x="74" y="823" class="b">The brain reads calendars, weather and albums.</text>
<circle class="giltf" cx="54" cy="848" r="11"/>
<text x="54" y="853" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">2</text>
<text x="74" y="853" class="b">It crops photos and builds the finished page.</text>
<circle class="giltf" cx="54" cy="878" r="11"/>
<text x="54" y="883" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">3</text>
<text x="74" y="883" class="b">The frame asks the brain for the page every 30 s.</text>
<circle class="giltf" cx="54" cy="908" r="11"/>
<text x="54" y="913" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">4</text>
<text x="74" y="913" class="b">A tap on the frame (I did it) goes to the brain.</text>
<circle class="giltf" cx="54" cy="938" r="11"/>
<text x="54" y="943" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">5</text>
<text x="74" y="943" class="b">A parent approves it from a phone.</text>
<circle class="giltf" cx="54" cy="968" r="11"/>
<text x="54" y="973" class="h" text-anchor="middle" style="fill:#ffffff;font-size:15px">6</text>
<text x="74" y="973" class="b">A Mac can send Apple favorites and lists.</text>
</svg>
