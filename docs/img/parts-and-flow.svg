<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img" aria-labelledby="title desc">
<title id="title">What you need, and how it fits together</title>
<desc id="desc">A kit of six parts: the picture frame, a small always-on computer or a Home Assistant box, the home router, a parent&#x27;s phone, an optional Mac and cables. Below, six numbered steps show how information moves between them.</desc>
<style>
svg { --bg:#faf6ee; --card:#ffffff; --soft:#f3ecdc; --ink:#1d2a44; --muted:#5a6273; --line:#d8ccb2;
  --navy:#1d2a44; --onnavy:#faf6ee; --gilt:#b8913a; --icon:#1d2a44; --off:#c9c2b2; --knob:#ffffff; }
@media (prefers-color-scheme: dark) {
