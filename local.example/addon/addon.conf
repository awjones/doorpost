# Settings for building the Home Assistant add-on from your private copy (scripts/build-addon.sh).
# KEY=value lines. This file is read as text, never run.

# The name in Home Assistant's app list and the sidebar.
ADDON_NAME=Our Frame
ADDON_PANEL_TITLE=Our Frame

# Home Assistant offers an update only when the version goes up. The version is <prefix>.<commit count>.
# If you installed a build with a higher version before (say 1.1.70), start above it.
ADDON_VERSION_PREFIX=1.1
