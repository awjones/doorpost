<html lang="en">

<title>Doorpost · Settings</title>

<style>
  html, body { background: var(--a-paper); overflow: auto; height: auto; }
  body { user-select: auto; -webkit-user-select: auto; }
  .aband { background: var(--a-head-bg); border-bottom: 3px double var(--a-head-rule); color: var(--a-head-ink); padding: 14px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 5; }
  .aband .mono { width: 52px; height: 52px; background: var(--a-head-ink); }
  .aband .script { font-family: var(--a-font-script); font-size: 34px; line-height: 1.1; }
  .aband .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--a-head-soft); }
  .aband .links { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .aband .links a { color: var(--a-head-ink); border: 1px solid var(--a-head-ink); border-radius: var(--a-pill); padding: 8px 14px; font-size: 14px; font-weight: 600; text-decoration: none; }
  .layout { display: flex; gap: 20px; max-width: 1120px; margin: 0 auto; padding: 20px 16px 80px; flex-wrap: wrap; align-items: flex-start; }
  .side { flex: 1 1 200px; max-width: 240px; position: sticky; top: 100px; display: flex; flex-direction: column; gap: 2px; }
  .side a { padding: 10px 14px; border-radius: calc(var(--a-radius) - 4px); color: var(--a-ink); text-decoration: none; font-weight: 600; font-size: 15px; }
  .side a:hover { background: var(--a-tile); }
  .content { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 760px) { .side { position: static; max-width: none; flex-direction: row; overflow-x: auto; } .side a { white-space: nowrap; } .aband .script { font-size: 26px; } }
  .card { overflow: visible; padding: 20px 22px; gap: 12px; scroll-margin-top: 100px; }
  .card > h2 { font-family: var(--a-font-display); font-size: 26px; font-weight: 600; }
  .help { font-size: 14px; color: var(--a-soft); line-height: 1.45; }
  .help b { color: var(--a-ink); }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--a-soft); flex: 1 1 160px; min-width: 0; }
  input[type=text], input[type=url], input[type=email], input[type=password], input[type=number], input[type=time], input[type=date], input[type=search], select {
    height: 44px; border-radius: calc(var(--a-radius) - 4px); border: 1.5px solid var(--a-line); background: var(--a-field); padding: 0 12px; font: 500 15px var(--a-font-body); color: var(--a-field-ink); width: 100%; box-sizing: border-box; }
  input[type=color] { height: 44px; width: 56px; border: 1.5px solid var(--a-line); border-radius: calc(var(--a-radius) - 4px); background: var(--a-field); padding: 3px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .item { border: 1px solid var(--a-line-soft); background: var(--a-tile); border-radius: calc(var(--a-radius) - 2px); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { height: 44px; padding: 0 18px; border-radius: var(--a-pill); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: var(--a-accent); color: var(--a-accent-ink); box-shadow: inset 0 0 0 1px var(--a-rule); }
  .btn.line { border: 1.5px solid var(--a-ink); background: var(--a-card); color: var(--a-ink); }
  .btn.quiet { color: var(--a-soft); border: 1px solid var(--a-line); background: var(--a-card); }
  .btn.danger { color: var(--a-danger); border: 1px solid var(--a-line); background: var(--a-card); }
  .result { font-size: 14px; font-weight: 600; }
  .result.ok { color: var(--a-ok); } .result.bad { color: var(--a-danger); }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .days button { width: 40px; height: 36px; border-radius: calc(var(--a-radius) - 6px); border: 1px solid var(--a-line); background: var(--a-field); font-size: 13px; font-weight: 700; color: var(--a-soft); }
  .days button.on { background: var(--a-accent); color: var(--a-accent-ink); border-color: var(--a-accent); }
  .face-edit { display: flex; align-items: center; gap: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .thumb { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 16/10; background: var(--a-line-soft); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; right: 6px; top: 6px; background: rgba(14, 22, 34, 0.7); color: #FFFFFF; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .thumb small { position: absolute; left: 6px; bottom: 6px; background: rgba(14, 22, 34, 0.7); color: #FFFFFF; border-radius: 6px; padding: 2px 6px; font-size: 11px; }
  .drop { border: 2px dashed var(--a-line); border-radius: calc(var(--a-radius) - 2px); padding: 18px; text-align: center; color: var(--a-soft); font-weight: 600; }

  #toast.bad { background: var(--a-danger); color: var(--a-danger-ink); border-color: var(--a-danger); }

  .seg button { height: 32px; padding: 0 12px; border-radius: var(--a-pill); font-size: 13px; font-weight: 500; color: var(--a-muted); background: transparent; }
  .seg button.on { font-weight: 700; color: var(--a-ink); background: var(--a-line); }
  .seg button.on.special { background: var(--a-accent); color: var(--a-accent-ink); }
  .fam-img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--a-rule); flex-shrink: 0; }
  .fam-initial { display: grid; place-items: center; background: var(--a-accent); color: var(--a-accent-ink); font: 600 44px var(--a-font-display); }
  .fam-useinit { font-size: 13px; margin-top: 2px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .fam-photo .pt-acts .btn { white-space: nowrap; height: 38px; font-size: 14px; }
  .pg { border: 1px solid var(--a-line); border-radius: calc(var(--a-radius) - 2px); padding: 0 14px; margin-top: 8px; background: var(--a-card); }

  .pg > summary small { color: var(--a-label); font-weight: 600; }

  .pg-card { background: var(--a-card); color: var(--a-ink); border-radius: 16px; max-width: 640px; width: 100%; display: flex; gap: 20px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); flex-wrap: wrap; }
  .pg-art { position: relative; width: 180px; height: 360px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 2px var(--a-rule); flex-shrink: 0; margin: 0 auto; }
  .pg-text { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; }
  .pg-text h3 { margin: 0; font: 600 26px var(--a-font-display); }

  .pg-code { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pg-code code { background: var(--a-tile); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  .sp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 6px; }
  .sp-sum { background: var(--a-card); border: 1px solid var(--a-line); border-radius: calc(var(--a-radius) - 2px); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .sp-sum > span { font-size: 13px; color: var(--a-soft); line-height: 1.4; }
  /* Settings > Lists and Photos: one card per choice (Apple / Google / none) */
  .provs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 6px 0 14px; }
  .prov { background: var(--a-card); border: 1px solid var(--a-line); border-radius: calc(var(--a-radius) - 2px); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }

  .sp-toggles { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; border: 1px solid var(--a-line); border-radius: calc(var(--a-radius) - 2px); padding: 10px 14px; margin-top: 12px; background: var(--a-card); }
  .sp-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sp-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sp-switch span { width: 38px; height: 22px; border-radius: 999px; background: var(--a-track); position: relative; transition: background .15s; flex-shrink: 0; }
  .sp-switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sp-switch input:checked + span { background: var(--a-accent); }
  .sp-switch input:checked + span::after { left: 19px; }
  .sp-switch input:focus-visible + span { outline: 2px solid var(--a-focus); outline-offset: 2px; }
  .sp-count { font-size: 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }

  .sp-head { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .sp-head h3 { margin: 0; font: 600 20px var(--a-font-display); }
  .sp-view { margin-left: auto; }
  .sp-minis { display: flex; gap: 4px; margin-left: auto; }
  .sp-mini { position: relative; display: block; width: 22px; height: 29px; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .sp-badge { position: absolute; top: 6px; left: 6px; background: rgba(22,50,79,.9); color: #C9A55A; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 7px; }
  .sp-auto { position: absolute; top: 6px; right: 6px; background: rgba(255,253,248,.94); color: #16324F; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 2px 6px; }
  .sp-ph { top: auto; bottom: 6px; }

  .sx-auto { background: var(--a-tile); color: var(--a-ink); border-radius: 8px; padding: 8px 10px; font-size: 13px; }

  .sx-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sx-add input, .sx-add select { width: auto; }

  .sr-tools #sr-newlook { flex: 1 1 200px; }
  .sr-headrow, .sr-row { display: grid; grid-template-columns: 40px minmax(120px, 1fr) minmax(150px, 1.2fr) auto auto 28px; gap: 10px; align-items: center; }
  .sr-headrow { padding: 0 10px 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--a-label); }
  .sr-list { border: 1px solid var(--a-line); border-radius: calc(var(--a-radius) - 2px); overflow: hidden; }

  .sr-word { font-size: 14px; }
  .sr-row select { height: 36px; }

  .sr-del { border: none; background: none; color: var(--a-danger); font-size: 20px; font-weight: 700; cursor: pointer; }

  }
  .fam-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }

  .fam-photo .pt-acts .btn { justify-content: center; }
  .pt-img.fam-img { width: 96px; height: 120px; border-radius: 48px / 60px; }
  .fam-main { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .fam-main .row { align-items: flex-start; }
  .pt-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .pt-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 10px; border: 1px solid var(--a-line); border-radius: calc(var(--a-radius) - 2px); }
  .pt-img { width: 64px; height: 80px; border-radius: 40px / 50px; object-fit: cover; box-shadow: 0 0 0 3px var(--a-rule); flex-shrink: 0; }
  .pt-none { display: grid; place-items: center; background: var(--a-accent); color: var(--a-accent-ink); font: 600 26px var(--a-font-display); }
  .pt-who { flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pt-who small { color: var(--a-soft); }
  .pt-who .f { flex: none; max-width: 360px; }
  .pt-acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .sp-thumb { background: #16324F; cursor: pointer; }
  .sp-thumb:hover, .sp-thumb:focus { box-shadow: 0 0 0 3px var(--a-rule); outline: none; }
  .sp-thumb small.pcode { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .sp-thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  @media (max-width: 760px) { .hrow { grid-template-columns: minmax(0, 1fr) auto; } .hrow .hd { display: none; } .hrow.check { grid-template-columns: 22px minmax(0, 1fr); } }
  .side a.on { background: var(--a-accent); color: var(--a-accent-ink); box-shadow: inset 0 0 0 1px var(--a-rule); }
  .help a { color: var(--a-link); font-weight: 700; }
  .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; vertical-align: -2px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn { text-decoration: none; color: var(--a-ink); }
  .fold-head .hn { flex: 1; min-width: 0; }
  .fold-head .hn small { display: block; font-size: 12px; color: var(--a-label); font-weight: 600; }

  .fx-modes button { height: 36px; padding: 0 16px; border-radius: var(--a-pill); font-size: 14px; font-weight: 600; color: var(--a-soft); background: transparent; }
  .fx-modes button.on { background: var(--a-accent); color: var(--a-accent-ink); font-weight: 700; }
